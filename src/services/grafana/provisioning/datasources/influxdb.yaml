apiVersion: 1

datasources:
  - name: InfluxDB
    type: influxdb
    access: proxy
    url: http://localhost:8086
    isDefault: true
    jsonData:
      version: Flux
      organization: navlori
      defaultBucket: async_data
    secureJsonData:
      # Grafana expands $INFLUXDB_TOKEN from the process environment.
      # Set it via the .env file at the repo root (see .env.example) before
      # starting Grafana via scripts/services.ps1.
      token: $INFLUXDB_TOKEN
