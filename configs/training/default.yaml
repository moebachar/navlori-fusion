# Training configuration
training:
  epochs: 200
  batch_size: 512
  optimizer:
    name: adamw
    lr: 1.0e-3
    weight_decay: 1.0e-4
  scheduler:
    name: onecycle
    max_lr: ${training.optimizer.lr}
    pct_start: 0.3
  loss:
    name: huber
    delta: 0.5
  early_stopping:
    patience: 25
    min_delta: 1.0e-4
  gradient_clip: 1.0
