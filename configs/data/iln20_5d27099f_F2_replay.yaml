# iln20_5d27099f_F2_replay — 4-modality replay dataset (pipeline v2, 2026-09-10)
# Real MSILN WiFi+IMU (verbatim, on the per-path dilated clock) + synthesized
# camera + odometry, from a stock Tiago++ driven on its wheels through the
# Webots reconstruction. 49 paths pass the accuracy gate (splits below).
# WiFi preprocessing follows the msiln convention (581 APs -> per-AP set
# transformer, raw RSSI; M1: whitening destroys WiFi). World-frame IMU (M4).
data:
  name: iln20_5d27099f_F2_replay
  root: ${oc.env:NAVLORI_DATA_ROOT,data}
  collection_dir: iln20_5d27099f_F2_replay
  source: replay
  modalities: [wifi, imu, odom, camera]
  wifi_encoder_type: set_transformer

  split:
    train_paths: [3, 4, 10, 11, 14, 15, 16, 19, 21, 22, 23, 24, 25, 27, 30, 31, 32, 34, 35, 39, 40, 41, 42, 46, 47, 49, 52, 53, 54, 56, 57, 59, 60]
    val_paths: [2, 5, 33, 45, 48, 50, 58]
    test_paths: [1, 6, 8, 9, 17, 18, 20, 51]

  preprocessing:
    normalize: true
    wifi_norm: raw
    wifi_pca: 128
    wifi_max_stale_s: null
    imu_frame: world

  windows:
    imu: 32
    odom: 16
    wifi: 1
    camera: 1
