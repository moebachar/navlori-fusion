# RoNIN subject a000 (within-trial split). LEAKY — DEV USE ONLY.
# 215 chunks total (~15s each, seed=42, split: train=150 / val=32 / test=33).
# Train and val are drawn from the SAME sequences: chunks of ONE continuous
# walk are randomly assigned to splits, so train and val see temporally
# adjacent ~15s slices of the same trajectory. WiFi BSSIDs and IMU
# characteristics match across splits — and so does the spatial coverage.
# Numbers from this split are not generalisation evidence; they are
# memorisation evidence. For honest evaluation use configs/data/ronin_a000.yaml.
# Modalities: wifi + imu (no odom, no camera - smartphone dataset).
# Ground truth is Tango VSLAM (x, y) in meters, downsampled to 10 Hz.
data:
  name: ronin_a000_intra
  root: ${oc.env:NAVLORI_DATA_ROOT,data}
  collection_dir: ronin_a000_intra
  source: ronin
  modalities: [wifi, imu]

  split:
    train_paths: [0, 2, 3, 4, 5, 9, 10, 12, 13, 14, 15, 16, 18, 19, 21, 25, 27, 29, 30, 32, 33, 34, 36, 37, 38, 41, 42, 43, 44, 45, 46, 47, 48, 51, 52, 53, 54, 60, 61, 63, 64, 65, 66, 68, 69, 72, 73, 74, 76, 77, 78, 79, 80, 81, 82, 83, 84, 85, 89, 90, 93, 94, 95, 98, 99, 100, 101, 102, 103, 104, 105, 106, 109, 110, 111, 112, 113, 115, 116, 118, 119, 120, 121, 122, 123, 124, 125, 126, 127, 128, 130, 131, 132, 133, 134, 135, 136, 138, 140, 142, 144, 145, 146, 148, 149, 152, 153, 155, 156, 157, 158, 159, 160, 161, 162, 164, 165, 167, 168, 169, 170, 171, 172, 174, 175, 176, 177, 178, 181, 182, 184, 185, 186, 187, 190, 191, 193, 194, 197, 198, 200, 201, 203, 204, 206, 207, 208, 209, 210, 213]
    val_paths:   [1, 11, 17, 20, 24, 31, 39, 40, 49, 58, 67, 71, 75, 86, 87, 88, 91, 92, 96, 97, 117, 137, 141, 147, 150, 180, 192, 195, 196, 199, 205, 214]
    test_paths:  [6, 7, 8, 22, 23, 26, 28, 35, 50, 55, 56, 57, 59, 62, 70, 107, 108, 114, 129, 139, 143, 151, 154, 163, 166, 173, 179, 183, 188, 189, 202, 211, 212]

  preprocessing:
    normalize: true
    wifi_pca: 128   # reduce 144 APs -> 128 dims

  windows:
    imu: 32    # ~1 s at 32 Hz
    wifi: 1    # single scan
