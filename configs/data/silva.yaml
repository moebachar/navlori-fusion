# Data source: Silva et al. Vehicle Industrial Environment Dataset
data:
  name: silva
  root: ${oc.env:NAVLORI_DATA_ROOT,../../data}/VehicleIndustrialEnvDataset
  source: silva
  modalities: [wifi, imu, odom]  # no vision in this dataset
  split:
    train_ratio: 0.7
    val_ratio: 0.15
    test_ratio: 0.15
  preprocessing:
    normalize: true
    seq_length: 50
