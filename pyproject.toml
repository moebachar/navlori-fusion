[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "navlori-fusion"
version = "0.1.0"
description = "Attention-Based Asynchronous Fusion of WiFi, Vision, IMU, and Odometry for Indoor Robot Localization"
requires-python = ">=3.11"
authors = [
    {name = "Mohamed Bachar", email = "mohamed.bachar@cesi.fr"},
]

dependencies = [
    # Core ML
    # NOTE: this machine has a GTX 1080 (Pascal, sm_61). PyTorch dropped
    # Pascal binaries starting 2.7, so cap torch at <2.7 and install the
    # CUDA 12.4 wheels explicitly:
    #   pip install --index-url https://download.pytorch.org/whl/cu124 \
    #       torch==2.6.0 torchvision==0.21.0
    "torch>=2.1,<2.7",
    "torchvision>=0.16,<0.22",
    "numpy>=1.24",
    "scipy>=1.11",
    "pandas>=2.1",

    # Configuration
    "hydra-core>=1.3",
    "omegaconf>=2.3",

    # Experiment tracking
    "mlflow>=2.10",
    "tensorboard>=2.15",

    # Hyperparameter search
    "optuna>=4.0",

    # Data versioning
    "dvc>=3.40",

    # Visualization
    "matplotlib>=3.8",
    "seaborn>=0.13",
    "plotly>=5.18",
    "influxdb-client>=1.40",
    "imageio-ffmpeg>=0.4",   # bundled ffmpeg binary for notebook mp4 export

    # Continuous-time models
    "torchdiffeq>=0.2",

    # Notebooks
    "ipykernel>=6.27",
    "jupyter>=1.0",
    "nbformat>=5.0",

    # Utilities
    "rich>=13.0",
    "tqdm>=4.66",
    "pyyaml>=6.0",
    "Pillow>=10.0",

    # Vision — PnP-based (x, y) evaluation of ACE SCR predictions
    "opencv-python>=4.8",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4",
    "pytest-cov>=4.1",
    "ruff>=0.2",
]

[tool.setuptools.packages.find]
where = ["src"]
include = ["pipeline*"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP"]
ignore = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-v --tb=short"
